openapi: 3.0.3
info:
  title: Order Service API
  version: 1.0.0
  description: Handles cart, order placement, status tracking, and order history.

servers:
  - url: http://localhost:8102
    description: Local
  - url: https://order.foodly.example.com
    description: Production

tags:
  - name: Cart
  - name: Orders

paths:
  /cart:
    get:
      tags: [Cart]
      summary: Get current cart
      responses:
        '200':
          description: Cart items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CartItem' }
    post:
      tags: [Cart]
      summary: Replace current cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/CartItem' }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CartItem' }

  /cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItem' }
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartItem' }

  /cart/items/{itemId}:
    delete:
      tags: [Cart]
      summary: Remove item from cart
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed }

  /orders:
    post:
      tags: [Orders]
      summary: Create order from current cart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreateRequest' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
    get:
      tags: [Orders]
      summary: List user orders
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [created, confirmed, preparing, picked_up, delivering, delivered, cancelled, refunded]
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get order by id
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { description: Not found }
    patch:
      tags: [Orders]
      summary: Cancel order by user (if allowed)
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [cancelled]
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CartItem:
      type: object
      required: [menuItemId, quantity]
      properties:
        id: { type: string }
        menuItemId: { type: string }
        hotelId: { type: string }
        quantity: { type: integer, minimum: 1 }
        notes: { type: string }
        selectedOptions:
          type: array
          items:
            type: object
            properties:
              optionId: { type: string }
        unitPrice: { type: number, format: float }
        totalPrice: { type: number, format: float }

    Address:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        country: { type: string }

    OrderTotals:
      type: object
      properties:
        subtotal: { type: number, format: float }
        discount: { type: number, format: float }
        deliveryFee: { type: number, format: float }
        tax: { type: number, format: float }
        grandTotal: { type: number, format: float }
        currency: { type: string }

    Order:
      type: object
      required: [id, userId, status, items, totals, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        hotelId: { type: string }
        status:
          type: string
          enum: [created, confirmed, preparing, picked_up, delivering, delivered, cancelled, refunded]
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        deliveryAddress:
          $ref: '#/components/schemas/Address'
        paymentId: { type: string }
        totals:
          $ref: '#/components/schemas/OrderTotals'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrderCreateRequest:
      type: object
      required: [hotelId, items, deliveryAddressId]
      properties:
        hotelId: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        deliveryAddressId: { type: string }
        promoCode: { type: string }
        notes: { type: string }

security:
  - bearerAuth: []
